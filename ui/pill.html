<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Suche</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
.pill {
  position: absolute; inset: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 12px 0 11px; border-radius: 999px;
  background: #2c2c2c; border: 1px solid rgba(255, 255, 255, 0.09);
  border-bottom-color: rgba(255, 255, 255, 0.05);
}
.pill:focus-within { background: #1f1f1f; border-color: rgba(255, 255, 255, 0.12); }
svg { width: 18px; height: 18px; flex: none; }
input {
  flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; padding: 0;
  color: #fff; caret-color: #fff; font: 14px "Segoe UI Variable Text", "Segoe UI", sans-serif;
}
input::placeholder { color: rgba(255, 255, 255, 0.786); }
input::selection { background: #0078d4; }
</style>
</head>
<body>
<div class="pill">
  <svg viewBox="0 0 20 20" aria-hidden="true">
    <defs>
      <linearGradient id="ring" x1="15" y1="2" x2="3" y2="14" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#2b9bf4"/>
        <stop offset="0.55" stop-color="#1fb8a3"/>
        <stop offset="1" stop-color="#43c35e"/>
      </linearGradient>
    </defs>
    <circle cx="8.6" cy="8.4" r="5.6" fill="none" stroke="url(#ring)" stroke-width="2.3"/>
    <path d="M12.7 12.6l4.4 4.4" stroke="#e8e8e8" stroke-width="2.4" stroke-linecap="round"/>
  </svg>
  <input id="q" placeholder="Suche" autocomplete="off" spellcheck="false" aria-label="Suche">
</div>
<script>
const q = document.getElementById('q');
const send = (m) => window.ipc.postMessage(JSON.stringify(m));
let timer = 0;
function flush() { clearTimeout(timer); timer = 0; send({ t: 'q', v: q.value }); }
q.addEventListener('input', () => {
  clearTimeout(timer);
  // first keystroke right away, then coalesce fast typing
  timer = setTimeout(flush, q.value.length <= 1 ? 0 : 30);
});
q.addEventListener('keydown', (e) => {
  let k = e.key;
  if (k === 'Tab') k = e.shiftKey ? 'ArrowUp' : 'ArrowDown';
  if (!['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Enter', 'Escape'].includes(k)) return;
  e.preventDefault();
  if (k === 'Enter' && timer) flush();
  send({ t: 'key', k, ctrl: e.ctrlKey, shift: e.shiftKey, v: q.value });
});
document.addEventListener('contextmenu', (e) => { if (e.target !== q) e.preventDefault(); });
document.addEventListener('mousedown', (e) => { if (e.target !== q) { e.preventDefault(); q.focus(); } });
window.P = {
  show() { q.value = ''; clearTimeout(timer); q.focus(); },
  hide() { q.value = ''; clearTimeout(timer); },
  focus() { q.focus(); },
  type(text) { q.value = text; q.dispatchEvent(new Event('input')); },
};
</script>
</body>
</html>
